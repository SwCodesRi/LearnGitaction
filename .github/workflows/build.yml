name: Build, Pack and Publish to JFrog Artifactory

# Interview-focused explanation of the CI flow: 
# 1. Checkout source code from the repository.
# 2. Install the .NET SDK required by the solution.
# 3. Restore NuGet packages to make the build reproducible.
# 4. Build in Release mode to validate compile-time correctness.
# 5. Run tests to verify behavior before packaging.
# 6. Pack the project into a NuGet package (.nupkg).
# 7. Upload the generated package as a workflow artifact for traceability.
# 8. Push the package to JFrog Artifactory using authenticated NuGet credentials.
# This creates a complete CI/CD pipeline for a .NET solution.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
